# Supply-chain policy, enforced in CI by `cargo deny check`.
[graph]
all-features = true

[advisories]
# Any RustSec advisory (vulnerability, unmaintained, unsound, yanked) affecting the lockfile
# fails the build. Accept a specific one only with an `ignore` entry and a reason.
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members depend on each other by path only.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
