name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Every job builds against the committed .sqlx metadata unless it needs a real database.
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  supply-chain:
    name: Dependency advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Policy lives in deny.toml: RustSec advisories, yanked crates, licenses, sources.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: moneymanager
          # Ephemeral, loopback-only service container; a password here would be a
          # committed credential with no security value.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/moneymanager
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # Pinned to the sqlx version in Cargo.lock, so `prepare --check` cannot drift.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features postgres,rustls

      - name: Apply migrations
        run: sqlx migrate run

      # Fails if a query drifted from the schema without .sqlx being regenerated.
      - name: Verify offline query metadata is current
        env:
          SQLX_OFFLINE: "false"
        run: cargo sqlx prepare --workspace --check -- --all-targets

      # `#[sqlx::test]` provisions its own throwaway databases from DATABASE_URL.
      - name: Run tests
        env:
          SQLX_OFFLINE: "false"
        run: cargo test --workspace

  docker:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
